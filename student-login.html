<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PLATINUM ACADEMY | دخول التوفل الوطني</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eef3f8;color:#172238;font:16px system-ui,-apple-system,"Segoe UI",Arial,sans-serif}header{background:#122c52;color:#fff;padding:22px 16px;text-align:center}header h1{margin:0;font-size:24px}header p{margin:6px 0 0;opacity:.9}.wrap{max-width:560px;margin:38px auto;padding:0 16px}.card{background:#fff;border:1px solid #d9e2ed;border-radius:18px;padding:24px;box-shadow:0 8px 28px rgba(17,42,76,.08)}h2{margin:0 0 18px;font-size:21px}label{display:block;margin:13px 0 6px;font-weight:650}input{width:100%;padding:12px;border:1px solid #aab7c8;border-radius:10px;font:inherit;direction:ltr;text-align:left}button{width:100%;margin-top:18px;border:0;background:#173c70;color:#fff;border-radius:10px;padding:12px 16px;font:inherit;font-weight:700;cursor:pointer}button:disabled{opacity:.55;cursor:wait}.status{margin-top:16px;min-height:24px;white-space:pre-wrap;text-align:center}.bad{color:#a11}.ok{color:#0a6b3d}.meta{margin-top:14px;padding:12px;background:#f7f9fc;border-radius:10px;font-size:14px;display:none}.logout{background:#55657b}.small{font-size:13px;color:#65728a;margin-top:14px;text-align:center}
</style>
</head>
<body>
<header><h1>PLATINUM ACADEMY | التوفل الوطني</h1><p>دخول الطالب — الاشتراك 60 يومًا من أول دخول مؤهل</p></header>
<div class="wrap"><div class="card">
<h2>دخول الطالب</h2>
<form id="loginForm">
<label for="username">اسم المستخدم</label>
<input id="username" autocomplete="username" required pattern="[A-Za-z0-9._-]{4,40}" placeholder="student001">
<label for="password">كلمة المرور</label>
<input id="password" type="password" autocomplete="current-password" required minlength="12">
<button id="loginBtn" type="submit">دخول إلى المنصة</button>
</form>
<div id="meta" class="meta"></div>
<button id="logoutBtn" class="logout" type="button" style="display:none">تسجيل الخروج</button>
<div id="status" class="status" role="status"></div>
<div class="small">يجب أن يكون الحساب مفعّلًا من إدارة الأكاديمية وغير موقوف وغير منتهي.</div>
</div></div>
<script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2';
const URL='https://yqgqylzfveiennyprsip.supabase.co';
const KEY='sb_publishable_uZ1Oyk5hnQfjkJFfvdIW3A_zZmEhHYv';
const sb=createClient(URL,KEY);
const $=id=>document.getElementById(id);
const internalEmail=u=>`${u.trim().toLowerCase()}@students.platinumacademy.invalid`;
function say(msg,type=''){const s=$('status');s.textContent=msg;s.className='status '+type}
function fmt(v){return v?new Date(v).toLocaleString('ar-JO'):'—'}
async function checkAccess(){
 const {data,error}=await sb.rpc('toefl_student_access');
 if(error) throw error;
 const row=Array.isArray(data)?data[0]:data;
 if(!row||!row.allowed) throw new Error(row?.message||'الحساب غير مخوّل للدخول');
 $('meta').style.display='block';
 $('meta').innerHTML=`<b>${row.full_name||'الطالب'}</b><br>أول دخول: ${fmt(row.first_login_at)}<br>انتهاء الاشتراك: ${fmt(row.expires_at)}`;
 $('logoutBtn').style.display='block';
 say('تم التحقق من الاشتراك. جارٍ فتح المنصة...','ok');
 setTimeout(()=>location.href='./index.html',800);
}
$('loginForm').onsubmit=async e=>{
 e.preventDefault();const btn=$('loginBtn');btn.disabled=true;say('جارٍ تسجيل الدخول...');
 try{
  const username=$('username').value.trim().toLowerCase();
  const {error}=await sb.auth.signInWithPassword({email:internalEmail(username),password:$('password').value});
  if(error) throw error;
  await checkAccess();
 }catch(e){await sb.auth.signOut();say(e?.message||'تعذر تسجيل الدخول','bad');btn.disabled=false}
};
$('logoutBtn').onclick=async()=>{await sb.auth.signOut();$('meta').style.display='none';$('logoutBtn').style.display='none';say('تم تسجيل الخروج');};
const {data:{session}}=await sb.auth.getSession();
if(session){try{await checkAccess()}catch(e){await sb.auth.signOut();say(e?.message||'تعذر التحقق من الاشتراك','bad')}}
</script>
</body></html>
